[project]
name = "document-authenticity"
version = "0.1.0"
description = "Sənəd saxtakarlığı aşkarlanması üçün çox-mərhələli ML pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "scikit-image>=0.23",
    "pydantic>=2.6",
    "numpy>=1.26",
    "opencv-python==4.10.0.84",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pytesseract>=0.3.10",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.pytest.ini_options]
markers = [
    "evaluation: metrik-əsaslı, data asılı testlər (yavaş ola bilər)",
]
addopts = "--cov=src/doc_auth --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "torch.*",
]
ignore_missing_imports = true
