[project]
name = "document-authenticity"
version = "0.1.0"
description = "Sənəd saxtakarlığı aşkarlanması üçün çox-mərhələli ML pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.pytest.ini_options]
markers = [
    "evaluation: metrik-əsaslı, data asılı testlər (yavaş ola bilər)",
]
addopts = "--cov=src/doc_auth --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
