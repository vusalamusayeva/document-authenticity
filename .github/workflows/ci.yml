name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system media and OpenCV libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev]"

      - name: Verify OpenCV Haar cascade and face detection
        run: |
          python -c "import numpy as np; from doc_auth.deepfake.face_detector import _load_face_cascade, detect_faces; c = _load_face_cascade(); assert not c.empty(); out = detect_faces(np.zeros((120, 160, 3), dtype=np.uint8)); assert isinstance(out, list)"

      - name: Run pytest suite
        run: |
          python -m pytest -v

      - name: Run benchmark smoke check
        run: |
          python scripts/benchmark_deepfake.py --frames 10 --width 160 --height 120
