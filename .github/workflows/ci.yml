name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-build-isolation || pip install pytest fastapi httpx python-multipart numpy opencv-python pydantic
          pip install pytest pytest-cov httpx python-multipart

      - name: Run pytest suite
        run: |
          python -m pytest -v

      - name: Run benchmark smoke check
        run: |
          python scripts/benchmark_deepfake.py --frames 10 --width 160 --height 120